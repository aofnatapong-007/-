<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ระบบเช่าจักรยาน 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: split screen. Left = 3D bike station (follows the step), right = activity diagram in 3 swimlanes. */
:root{
  --bg:#eef2f6; --panel:#ffffff; --fg:#14202e; --muted:#5a6b7d; --line:#cfd8e2; --line2:#aab8c7;
  --user:#7b4fb0; --user-bg:#f1e9f9; --sys:#2f6fc4; --sys-bg:#e4eefb; --bike:#2e8b57; --bike-bg:#e3f3ea;
  --active:#e08a00; --visited:#fff3d6; --ok:#1f9d55; --bad:#d23b3b; --node:#ffffff; --nodeline:#4a5b6d;
  --sky1:#bddcf6; --sky2:#f3f8fc; --ground:#aab7c4; --lane3d:#8e9cab;
  --f-display:'Prompt','Noto Sans Thai',sans-serif; --f-body:'Noto Sans Thai',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1621; --panel:#15202e; --fg:#e6edf5; --muted:#93a4b7; --line:#2a3a4d; --line2:#4a5d73;
  --user:#b894e6; --user-bg:#251d3a; --sys:#6aa5f0; --sys-bg:#15263d; --bike:#5cc58a; --bike-bg:#14291d;
  --active:#ffb938; --visited:#3a2f14; --ok:#4cd187; --bad:#ff6b6b; --node:#1b2a3c; --nodeline:#8ea2b8;
  --sky1:#070d18; --sky2:#1d3150; --ground:#2b3a4b; --lane3d:#202d3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621; --panel:#15202e; --fg:#e6edf5; --muted:#93a4b7; --line:#2a3a4d; --line2:#4a5d73;
  --user:#b894e6; --user-bg:#251d3a; --sys:#6aa5f0; --sys-bg:#15263d; --bike:#5cc58a; --bike-bg:#14291d;
  --active:#ffb938; --visited:#3a2f14; --ok:#4cd187; --bad:#ff6b6b; --node:#1b2a3c; --nodeline:#8ea2b8;
  --sky1:#070d18; --sky2:#1d3150; --ground:#2b3a4b; --lane3d:#202d3c; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
h1{font:600 20px/1.2 var(--f-display);margin:0}
h1 small{display:block;font:400 12px var(--f-body);color:var(--muted);margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.ctrl button{font:500 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,.n:focus-visible{outline:3px solid var(--active);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stage,.flow{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
#view{flex:1;min-height:0;position:relative;background:linear-gradient(180deg,var(--sky1),var(--sky2));cursor:grab;touch-action:none}
#view:active{cursor:grabbing}
#view canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:10px;top:8px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 8px;border-radius:99px;pointer-events:none}
.cap{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:2px}
.cap .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chip{font:600 11px var(--f-body);padding:1px 8px;border-radius:99px;color:#fff}
.chip.user{background:var(--user)}.chip.system{background:var(--sys)}.chip.station{background:var(--bike)}
.cap h2{font:600 16px/1.3 var(--f-display);margin:0;text-wrap:balance}
.cap p{margin:0;color:var(--muted);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--line)}
.ctrl .dots{display:flex;gap:4px;flex:1;min-width:120px}
.ctrl .dots i{flex:1;height:6px;border-radius:3px;background:var(--line);cursor:pointer;min-width:4px}
.ctrl .dots i.on{background:var(--active)}
.ctrl .dots i.cur{background:var(--fg)}
.lanes{display:grid;grid-template-columns:1fr 1fr 1fr;font:600 12px var(--f-display);text-align:center;border-bottom:1px solid var(--line)}
.lanes div{padding:7px 4px;color:var(--fg)}
.lanes .u{background:var(--user-bg);color:var(--user)}.lanes .s{background:var(--sys-bg);color:var(--sys)}.lanes .b{background:var(--bike-bg);color:var(--bike)}
.flowscroll{flex:1;min-height:0;overflow:auto}
.flowin{min-width:540px}
svg{display:block;width:100%;height:auto;font-family:var(--f-body)}
.lane-u{fill:var(--user-bg)}.lane-s{fill:var(--sys-bg)}.lane-b{fill:var(--bike-bg)}
.laneline{stroke:var(--line2);stroke-width:1}
.n{cursor:pointer;opacity:.5;transition:opacity .25s}
.n.done,.n.active{opacity:1}
.n .shape{fill:var(--node);stroke:var(--nodeline);stroke-width:1.5}
.n.done .shape{fill:var(--visited)}
.n.active .shape{fill:var(--visited);stroke:var(--active);stroke-width:4}
.n text{fill:var(--fg);font-size:11px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.n .sub{fill:var(--muted);font:500 9.5px var(--f-mono)}
.n .dot{fill:var(--fg)}.n .endring{fill:none;stroke:var(--bad);stroke-width:3}
.e path{fill:none;stroke:var(--line2);stroke-width:1.5;marker-end:url(#a)}
.e.done path{stroke:var(--active);stroke-width:2.5;marker-end:url(#a2)}
.e text{fill:var(--muted);font-size:10px;text-anchor:middle}
.e.done text{fill:var(--fg);font-weight:600}
.ah{fill:var(--line2)}.ah2{fill:var(--active)}
@media (max-width:820px){
  body{padding-block:8px;gap:6px}
  h1{font-size:16px}h1 small{display:none}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,52fr) minmax(0,48fr)}
  .cap{padding:6px 12px}.cap p{font-size:12px}.ctrl{padding:6px 12px 8px}
}
@media (prefers-reduced-motion:reduce){.n{transition:none}}
</style>

<header>
  <h1>ระบบเช่าจักรยานสาธารณะ<small>โมเดล 3D ฝั่งซ้ายเคลื่อนไหวตามขั้นตอนใน Activity Diagram ฝั่งขวา</small></h1>
  <div class="seg" id="scen" role="group" aria-label="เลือกสถานการณ์"></div>
</header>
<main>
  <section class="stage" aria-label="โมเดล 3D">
    <div id="view"><div class="hint">ลากเพื่อหมุนมุมมอง · เลื่อนล้อเมาส์เพื่อซูม</div></div>
    <div class="cap" aria-live="polite">
      <div class="meta"><span class="chip" id="chip"></span><span id="prog"></span></div>
      <h2 id="ctitle"></h2><p id="cdesc"></p>
    </div>
    <div class="ctrl">
      <button id="prev" type="button">ก่อนหน้า</button>
      <button id="play" type="button">เล่นอัตโนมัติ</button>
      <button id="next" type="button">ถัดไป</button>
      <div class="dots" id="dots"></div>
    </div>
  </section>
  <section class="flow" aria-label="Activity Diagram">
    <div class="lanes"><div class="u">User (ผู้ใช้งาน)</div><div class="s">System / Application</div><div class="b">Bicycle &amp; Station</div></div>
    <div class="flowscroll" id="fs"><div class="flowin" id="svgbox"></div></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Diagram data ---------- */
const W=160,H=44,DW=56,DH=28;
const NODES={
 start:{t:'start',x:100,y:50,lane:'user'},
 login:{t:'act',x:100,y:110,l:'เข้าสู่ระบบ',s:'(login)',lane:'user'},
 elig:{t:'act',x:300,y:170,l:'ตรวจสอบสิทธิ์ผู้ใช้',s:'(checkEligibility)',lane:'system'},
 d1:{t:'dec',x:300,y:250,l:'ผ่านสิทธิ์?',lane:'system'},
 end1:{t:'end',x:380,y:250,lane:'system'},
 scan:{t:'act',x:100,y:320,l:'สแกน QR Code จักรยาน',lane:'user'},
 avail:{t:'act',x:500,y:320,l:'ตรวจสอบสถานะจักรยาน',s:'(checkAvailability)',lane:'station'},
 d2:{t:'dec',x:500,y:395,l:'พร้อมใช้งาน?',lane:'station'},
 end2:{t:'end',x:573,y:395,lane:'station'},
 create:{t:'act',x:300,y:395,l:'สร้างรายการเช่า',s:'(createRental)',lane:'system'},
 unlock:{t:'act',x:500,y:470,l:'อัปเดตสถานะ & ปลดล็อก',s:'(markAsRented / unlock)',lane:'station'},
 use:{t:'act',x:100,y:540,l:'ใช้งานและนำจักรยาน',l2:'มาคืนที่สถานี',lane:'user'},
 lock:{t:'act',x:500,y:540,l:'ล็อกจักรยาน & อัปเดตสถานี',s:'(lock / updateBikeCount)',lane:'station'},
 fee:{t:'act',x:300,y:610,l:'คำนวณค่าบริการ',s:'(endRental / calculateFee)',lane:'system'},
 d3:{t:'dec',x:300,y:680,l:'มีค่าบริการ?',lane:'system'},
 pay:{t:'act',x:300,y:750,l:'สร้าง QR Code & ชำระเงิน',s:'(processPayment)',lane:'system'},
 scanpay:{t:'act',x:100,y:750,l:'สแกนจ่ายเงิน',lane:'user'},
 end3:{t:'end',x:470,y:680,lane:'system'}
};
const EDGES=[
 ['start','login',[[100,64],[100,88]]],
 ['login','elig',[[180,110],[300,110],[300,148]]],
 ['elig','d1',[[300,192],[300,222]]],
 ['d1','end1',[[356,250],[367,250]],{t:'[ไม่ผ่าน]',x:372,y:272}],
 ['d1','scan',[[244,250],[100,250],[100,298]],{t:'[ผ่าน]',x:200,y:243}],
 ['scan','avail',[[180,320],[420,320]]],
 ['avail','d2',[[500,342],[500,367]]],
 ['d2','end2',[[556,395],[562,395]],{t:'[ไม่พร้อม]',x:556,y:424}],
 ['d2','create',[[444,395],[380,395]],{t:'[พร้อม]',x:412,y:387}],
 ['create','unlock',[[300,417],[300,435],[500,435],[500,448]]],
 ['unlock','use',[[420,470],[100,470],[100,518]]],
 ['use','lock',[[180,540],[420,540]]],
 ['lock','fee',[[500,562],[500,575],[300,575],[300,588]]],
 ['fee','d3',[[300,632],[300,652]]],
 ['d3','end3',[[356,680],[458,680]],{t:'[ไม่มีค่าบริการ]',x:407,y:672}],
 ['d3','pay',[[300,708],[300,728]],{t:'[มีค่าบริการ]',x:306,y:719,a:'start'}],
 ['pay','scanpay',[[220,750],[180,750]]],
 ['scanpay','end3',[[100,772],[100,805],[470,805],[470,692]]]
];
const PRE=['start','login','elig','d1'];
const SCEN={
 ok:{label:'ใช้งานปกติ มีค่าบริการ',steps:[...PRE,'scan','avail','d2','create','unlock','use','lock','fee','d3','pay','scanpay','end3']},
 nofee:{label:'ไม่มีค่าบริการ',steps:[...PRE,'scan','avail','d2','create','unlock','use','lock','fee','d3','end3']},
 deny:{label:'ไม่ผ่านสิทธิ์',steps:[...PRE,'end1']},
 busy:{label:'จักรยานไม่พร้อม',steps:[...PRE,'scan','avail','d2','end2']}
};
const LANE={user:'ผู้ใช้',system:'ระบบ',station:'สถานี / จักรยาน'};
function caption(id,sc){
 const pass=sc!=='deny',av=sc!=='busy',fee=sc==='ok';
 const C={
  start:['เริ่มต้นกระบวนการ','ผู้ใช้ยืนอยู่หน้าสถานีจักรยานพร้อมโทรศัพท์มือถือ'],
  login:['เข้าสู่ระบบ (login)','ผู้ใช้เปิดแอปและเข้าสู่ระบบ โทรศัพท์ส่งคำขอไปยังระบบ'],
  elig:['ตรวจสอบสิทธิ์ผู้ใช้','ระบบเรียก checkEligibility() เพื่อตรวจว่าบัญชีนี้เช่าได้หรือไม่'],
  d1:pass?['ผ่านสิทธิ์ ไปต่อ','ระบบยืนยันสิทธิ์แล้ว ผู้ใช้เดินไปที่จักรยาน']:['ไม่ผ่านสิทธิ์','ระบบปฏิเสธการเช่า'],
  end1:['สิ้นสุด: ไม่ผ่านสิทธิ์','กระบวนการหยุดที่นี่ ไม่มีการเช่าเกิดขึ้น'],
  scan:['สแกน QR Code จักรยาน','ผู้ใช้เดินไปที่จักรยานและสแกน QR ที่ตัวรถ'],
  avail:['ตรวจสอบสถานะจักรยาน','สถานีเรียก checkAvailability() ตรวจว่าคันนี้พร้อมใช้งานหรือไม่'],
  d2:av?['จักรยานพร้อมใช้งาน','ไฟสถานีเป็นสีเขียว ส่งผลกลับไปที่ระบบ']:['จักรยานไม่พร้อมใช้งาน','ไฟสถานีเป็นสีแดง ผู้ใช้ต้องเลือกคันอื่น'],
  end2:['สิ้นสุด: จักรยานไม่พร้อม','กระบวนการหยุดที่นี่ ยังไม่มีการเช่าเกิดขึ้น'],
  create:['สร้างรายการเช่า','ระบบเรียก createRental() ออกใบเช่าที่ผูกกับผู้ใช้และจักรยาน'],
  unlock:['อัปเดตสถานะ และปลดล็อก','markAsRented() เปลี่ยนสถานะเป็น "ถูกเช่า" สลักล็อกถอยออก จักรยานในสถานีลดลง 1 คัน'],
  use:['ใช้งานและนำจักรยานมาคืนที่สถานี','ผู้ใช้ปั่นออกไปแล้วกลับมาจอดที่ช่องจอดเดิม'],
  lock:['ล็อกจักรยาน และอัปเดตสถานี','lock() ให้สลักล็อกเข้าที่ และ updateBikeCount() เพิ่มจำนวนจักรยานในสถานี'],
  fee:['คำนวณค่าบริการ','endRental() ปิดรายการเช่า แล้ว calculateFee() คำนวณตามเวลาใช้งาน'],
  d3:fee?['มีค่าบริการ','ยอด ฿25.00 ต้องชำระเงิน']:['ไม่มีค่าบริการ','ใช้ภายในเวลาฟรี ระบบจบกระบวนการได้ทันที'],
  pay:['สร้าง QR Code และชำระเงิน','processPayment() สร้าง QR Code สำหรับยอด ฿25.00'],
  scanpay:['สแกนจ่ายเงิน','ผู้ใช้สแกน QR Code ด้วยแอปธนาคารเพื่อชำระเงิน'],
  end3:['สิ้นสุดกระบวนการ',fee?'ชำระเงินสำเร็จ รายการเช่าเสร็จสมบูรณ์':'ไม่มีค่าบริการ รายการเช่าเสร็จสมบูรณ์']
 };
 return C[id];
}

/* ---------- Diagram render ---------- */
const nodeEl={},edgeEl={};
function renderDiagram(){
 let s='<svg id="dg" viewBox="0 0 600 830" role="img" aria-label="Activity Diagram ระบบเช่าจักรยาน"><defs>'+
 '<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z" style="stroke:none"/></marker>'+
 '<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0 0L10 5L0 10z" style="stroke:none"/></marker></defs>'+
 '<rect class="lane-u" x="0" y="0" width="200" height="830"/><rect class="lane-s" x="200" y="0" width="200" height="830"/><rect class="lane-b" x="400" y="0" width="200" height="830"/>'+
 '<line class="laneline" x1="200" y1="0" x2="200" y2="830"/><line class="laneline" x1="400" y1="0" x2="400" y2="830"/>';
 EDGES.forEach(([f,t,p,lb],i)=>{
  s+='<g class="e" id="e'+i+'"><path d="M'+p.map(q=>q.join(' ')).join(' L')+'"/>'+(lb?'<text x="'+lb.x+'" y="'+lb.y+'" style="text-anchor:'+(lb.a||'middle')+'">'+lb.t+'</text>':'')+'</g>';
 });
 for(const id in NODES){
  const n=NODES[id];let b='';
  if(n.t==='start')b='<circle class="shape dot" cx="'+n.x+'" cy="'+n.y+'" r="14"/>';
  else if(n.t==='end')b='<circle class="shape endring" cx="'+n.x+'" cy="'+n.y+'" r="12"/><circle class="dot" cx="'+n.x+'" cy="'+n.y+'" r="8"/>';
  else if(n.t==='dec')b='<polygon class="shape" points="'+[[n.x-DW,n.y],[n.x,n.y-DH],[n.x+DW,n.y],[n.x,n.y+DH]].join(' ')+'"/><text x="'+n.x+'" y="'+n.y+'">'+n.l+'</text>';
  else{
   b='<rect class="shape" x="'+(n.x-W/2)+'" y="'+(n.y-H/2)+'" width="'+W+'" height="'+H+'" rx="10"/>';
   if(n.s)b+='<text x="'+n.x+'" y="'+(n.y-8)+'">'+n.l+'</text><text class="sub" x="'+n.x+'" y="'+(n.y+9)+'">'+n.s+'</text>';
   else if(n.l2)b+='<text x="'+n.x+'" y="'+(n.y-8)+'">'+n.l+'</text><text x="'+n.x+'" y="'+(n.y+9)+'">'+n.l2+'</text>';
   else b+='<text x="'+n.x+'" y="'+n.y+'">'+n.l+'</text>';
  }
  s+='<g class="n" id="n_'+id+'" data-id="'+id+'" tabindex="0" role="button" aria-label="'+(n.l||(n.t==='start'?'เริ่มต้น':'สิ้นสุด'))+'">'+b+'</g>';
 }
 s+='</svg>';
 document.getElementById('svgbox').innerHTML=s;
 for(const id in NODES){const el=document.getElementById('n_'+id);nodeEl[id]=el;
  el.addEventListener('click',()=>jumpTo(id));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jumpTo(id)}});}
 EDGES.forEach((e,i)=>edgeEl[e[0]+'>'+e[1]]=document.getElementById('e'+i));
}

/* ---------- 3D scene ---------- */
const DX=3.6,R=2.6,TH="'Noto Sans Thai',sans-serif",MONO="'JetBrains Mono',monospace";
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const SYSP=V(0,1.3,-2.2),LK={cam:V(0,1,8),sys:V(0,1.5,-2.2),bike:V(DX,0.8,0),qr:V(1.0,1.6,0.9),post:V(DX+1.65,1,0)};
const BEAM={sys:SYSP,bike:V(DX+0.05,0.75,0.08),qr:V(1.0,1.6,0.9)};

function canvasTex(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.anisotropy=4;return{c,x:c.getContext('2d'),t,w,h}}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function qrTexture(seed){
 const P=canvasTex(256,256),x=P.x,n=25,s=256/n;x.fillStyle='#fff';x.fillRect(0,0,256,256);x.fillStyle='#111';
 let h=seed;const rnd=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
 const fin=(a,b)=>{x.fillRect(a*s,b*s,7*s,7*s);x.fillStyle='#fff';x.fillRect((a+1)*s,(b+1)*s,5*s,5*s);x.fillStyle='#111';x.fillRect((a+2)*s,(b+2)*s,3*s,3*s)};
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){
  if((i<8&&j<8)||(i>16&&j<8)||(i<8&&j>16))continue;
  if(rnd()>0.5)x.fillRect(i*s,j*s,s,s)}
 fin(0,0);fin(18,0);fin(0,18);P.t.needsUpdate=true;return P.t}

function lerp(a,b,k){return a+(b-a)*k}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}

 requestAnimationFrame(frame);if(!gl||!T)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;const k=1-Math.exp(-dt*4.5);

 if(T.ride)S.rideT=Math.min(1,S.rideT+dt/5.5);else S.rideT=0;
 const act=S.rideT>0&&S.rideT<1,e=S.rideT*S.rideT*(3-2*S.rideT),th=e*Math.PI*2;
 const bike=parts.bike,user=parts.user;
 if(act){bike.position.set(DX+R*Math.sin(th),0,R-R*Math.cos(th));bike.rotation.y=-th;S.wheel-=dt*7}
 else{bike.position.set(DX,0,0);bike.rotation.y=0}
 parts.wheels.forEach(w=>w.rotation.z=S.wheel);
 if(act){user.position.set(bike.position.x,.32,bike.position.z);user.rotation.y=Math.atan2(Math.cos(th),Math.sin(th))}
 else{user.position.x=lerp(user.position.x,T.ux,k);user.position.z=lerp(user.position.z,T.uz,k);user.position.y=lerp(user.position.y,0,k);
  const L=LK[T.look];const want=Math.atan2(L.x-user.position.x,L.z-user.position.z);user.rotation.y+=angDiff(user.rotation.y,want)*k}
 parts.phoneMat.emissiveIntensity=lerp(parts.phoneMat.emissiveIntensity,T.phone?1.6:.15,k);
 /* pin */
 S.rel=lerp(S.rel,T.rel,k);parts.pin.position.x=DX+1.15+.38*S.rel;
 /* colors */
 const lc=tmp.set(COL[T.light]);parts.lightMat.color.lerp(lc,k);parts.lightMat.emissive.lerp(lc,k);
 const sc=new THREE.Color(COL[T.sys]);parts.ringMat.color.lerp(sc,k);parts.ringMat.emissive.lerp(sc,k);
 parts.ringG.rotation.y+=dt*(T.sys==='work'?3.2:.7);
 parts.srvMat.emissiveIntensity=.55+.25*Math.sin(now/260)*(T.sys==='work'?1:.2);
 /* beam */
 const showBeam=!!T.beam;parts.beamMat.opacity=lerp(parts.beamMat.opacity,showBeam?.75:0,k);parts.pulse.visible=showBeam;
 if(T.beam){const a=V(0,0,0);parts.phoneScr.getWorldPosition(a);const b=BEAM[T.beam],d=b.clone().sub(a),len=d.length();
  parts.beam.position.copy(a).addScaledVector(d,.5);parts.beam.scale.set(1,len,1);parts.beam.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());
  parts.pulse.position.copy(a).addScaledVector(d,(now/900)%1)}
 /* icons / ticket / qr */
 const iconPos=T.iconAt==='bike'?V(DX,2.35,0):T.iconAt==='sys'?V(2.0,2.6,-2.2):V(2.0,2.6,-2.2);
 [['ok',parts.iconOk],['bad',parts.iconBad]].forEach(([n,sp])=>{const s=lerp(sp.scale.x,T.icon===n?.9:.01,k*1.4);sp.scale.set(s,s,1);sp.position.lerp(iconPos,.4)});
 const tp=T.ticket?V(DX-.4,2.55,.3):SYSP,ts=T.ticket?1.25:.01;parts.ticket.position.lerp(tp,k);parts.ticket.scale.setScalar(lerp(parts.ticket.scale.x,ts,k));
 parts.ticket.position.y+=Math.sin(now/500)*.0015;
 parts.qr.scale.setScalar(lerp(parts.qr.scale.x,T.qr?1.25:.01,k));
 /* canvases */
 const sk=JSON.stringify([T.screen,T.light]);if(sk!==S.screenKey){S.screenKey=sk;drawScreen(T.screen,COL[T.light])}
 if(T.count!==S.bikeCount){S.bikeCount=T.count;drawCount(T.count)}
 const pk=JSON.stringify([T.panel,T.sys]);if(pk!==S.panelKey){S.panelKey=pk;drawPanel(T.panel,COL[T.sys])}
 /* camera */
 S.yaw=lerp(S.yaw,S.tYaw,.15);S.pitch=lerp(S.pitch,S.tPitch,.15);S.dist=lerp(S.dist,S.tDist,.15);
 const d=S.dist*(S.fit||1),cx=.4,cy=1.4,cz=-.2;
 camera.position.set(cx+d*Math.sin(S.yaw)*Math.cos(S.pitch),cy+d*Math.sin(S.pitch),cz+d*Math.cos(S.yaw)*Math.cos(S.pitch));camera.lookAt(cx,cy,cz);
 renderer.render(scene,camera);
}

/* ---------- Controller ---------- */
let sc='ok',idx=0,steps=SCEN.ok.steps,playing=false,timer=null;
const $=id=>document.getElementById(id);
function buildScen(){
 $('scen').innerHTML=Object.keys(SCEN).map(k=>'<button type="button" data-k="'+k+'" aria-pressed="'+(k===sc)+'">'+SCEN[k].label+'</button>').join('');
 $('scen').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{setScen(b.dataset.k,0)}));
}
function setScen(k,i){sc=k;steps=SCEN[k].steps;buildScen();buildDots();setStep(i)}
function buildDots(){
 $('dots').innerHTML=steps.map((s,i)=>'<i data-i="'+i+'" title="'+(NODES[s].l||(NODES[s].t==='start'?'เริ่มต้น':'สิ้นสุด'))+'"></i>').join('');
 $('dots').querySelectorAll('i').forEach(d=>d.addEventListener('click',()=>{stop();setStep(+d.dataset.i)}));
}
function setStep(i){
 idx=Math.max(0,Math.min(steps.length-1,i));const id=steps[idx];
 for(const n in nodeEl)nodeEl[n].setAttribute('class','n'+(steps.indexOf(n)>=0&&steps.indexOf(n)<idx?' done':'')+(n===id?' active':''));
 for(const k in edgeEl)edgeEl[k].setAttribute('class','e');
 for(let j=1;j<=idx;j++){const el=edgeEl[steps[j-1]+'>'+steps[j]];if(el)el.setAttribute('class','e done')}
 const c=caption(id,sc),lane=NODES[id].lane;
 $('chip').className='chip '+lane;$('chip').textContent=LANE[lane];$('prog').textContent='ขั้นที่ '+(idx+1)+' / '+steps.length;
 $('ctitle').textContent=c[0];$('cdesc').textContent=c[1];
 $('dots').querySelectorAll('i').forEach((d,j)=>d.className=j<idx?'on':j===idx?'cur':'');
 $('prev').disabled=idx===0;$('next').disabled=idx===steps.length-1;
 T=sceneFor(id,sc);
 const fs=$('fs'),r=nodeEl[id].getBoundingClientRect(),sr=fs.getBoundingClientRect();
 fs.scrollTo({top:Math.max(0,fs.scrollTop+(r.top-sr.top)-sr.height/2+r.height/2),behavior:'smooth'});
 if(playing){clearTimeout(timer);if(idx>=steps.length-1){stop()}else timer=setTimeout(()=>setStep(idx+1),id==='use'?7200:3400)}
}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='เล่นอัตโนมัติ'}
function jumpTo(id){stop();
 if(steps.indexOf(id)<0){const k=id==='end1'?'deny':id==='end2'?'busy':'ok';setScen(k,SCEN[k].steps.indexOf(id));return}
 setStep(steps.indexOf(id));
}
$('prev').addEventListener('click',()=>{stop();setStep(idx-1)});
$('next').addEventListener('click',()=>{stop();setStep(idx+1)});
$('play').addEventListener('click',()=>{
 if(playing){stop();return}
 playing=true;$('play').textContent='หยุดชั่วคราว';if(idx>=steps.length-1)setStep(0);else setStep(idx);
});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();setStep(idx+1)}else if(e.key==='ArrowLeft'){stop();setStep(idx-1)}});

renderDiagram();buildScen();buildDots();
gl=typeof THREE!=='undefined'&&init3D();
setStep(0);
if(gl){requestAnimationFrame(frame);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawLabels);
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
 new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}
</script>
